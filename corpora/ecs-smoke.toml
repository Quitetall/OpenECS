# OpenECS smoke corpus — a tiny, redistributable, SYNTHETIC EEG corpus.
#
# Ships in-repo so OpenECS runs offline with zero external data (SPEC/OpenECS-v1.1.md
# §8). NOT patient data: deterministic band-placed sinusoids in the EDF i16
# digital domain, regenerable byte-for-byte via
# `cargo run --example gen_smoke_corpus`. Paths are relative to this file's
# directory. For real public corpora (CHB-MIT, TUEG, …) see README.md and pin
# them locally with `openecs emit-corpus-manifest`.

spec_version = "1.1"
name = "ecs-smoke"
version = "1.0.0"

# The codec-agnostic content identity of SPEC/OpenECS-v1.1.md §8.2: SHA-256 over
# the corpus name/version, the sorted relative paths, the exact shapes and
# rational sample rates, and the decoded i64 samples. Verified by every 1.1
# grader before a grade is accepted.
[content_identity]
version = 1
digest = "93061ae3ef0e74887c90b978f63fc82e46e4e1e17ae249bc826d1d5e60e45e7d"

# LEGACY, shipped for one release (1.1) beside the block above so an OpenECS 1.0
# grader keeps its pin. It is the ABIR projection 1.0 computed; a 1.1 grader
# reads it, warns, and never verifies or writes it. Removed in the next release.
[abir_identity]
schema = "org.quitetall.openecs.corpus-identity-projection-v1"
content_id = "0d074e9141e35d42b37c1e7f706ee03f39f88e1bd6ab89304cd9d2864ac72d49"

